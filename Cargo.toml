[package]
name = "firepact-core"
version = "0.1.7"
edition = "2021"
rust-version = "1.75"
description = "Firestore-aware contract emitter and FULL_TRANSITIVE compatibility gate (the Rust core behind firepact)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/hironow/firepact"
homepage = "https://github.com/hironow/firepact"
keywords = ["firestore", "typescript", "codegen", "pydantic", "json-schema"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "firepact_core"
# rlib for the `firepact` binary; cdylib for the PyO3 extension module.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "firepact"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
# Optional: only compiled for the Python extension build (maturin --features python).
# The `firepact` binary builds without it, staying Python-free (DESIGN S9).
# abi3-py311: build a single stable-ABI wheel per platform that runs on
# CPython 3.11+ (incl. future versions), collapsing the per-version wheel matrix.
# The bindings only use abi3-safe APIs (str in/out, module + function registration).
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py311"], optional = true }

[features]
python = ["dep:pyo3"]
