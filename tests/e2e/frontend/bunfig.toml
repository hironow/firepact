[install]
# Resolve and install from the public registry no matter what mirror a developer
# has in ~/.npmrc, so bun.lock is reproducible for every clone and for CI, and so
# `bun audit` reaches npm's advisories endpoint rather than a mirror that may not
# serve one. Without this, a machine pointed at a mirror sees the audit fail on
# that mirror's outages, which reads as `just ci` being broken.
registry = "https://registry.npmjs.org/"
# Never resolve a version published less than seven days ago. Same window as
# `[tool.uv] exclude-newer = "7 days"` in pyproject.toml and the cooldown in
# .github/dependabot.yaml, so a compromised-then-yanked release is not pulled in
# on day zero on any side of the project. Applies to new resolutions only;
# bun.lock stays as it is.
minimumReleaseAge = 604800
