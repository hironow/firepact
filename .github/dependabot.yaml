# Dependabot version updates (first-party; replaces Renovate -- ADR 0013 favours
# minimizing third-party apps with repo write access). Dependabot security
# updates are enabled separately in the repo's security settings.
#
# Supply-chain hardening: a 7-day `cooldown` holds back every routine bump until
# the new version has been public for a week, so a compromised-then-yanked release
# is not pulled in on day zero. Cooldown applies to version updates only --
# Dependabot SECURITY updates (vulnerability fixes) bypass it and still land fast.
#
# Ecosystems in this repo:
#   github-actions  -> .github/workflows/*.yaml (SHA-pinned actions)
#   cargo           -> Cargo.toml (pyo3 packaging chain)
#   uv              -> pyproject.toml + uv.lock (pydantic drives schema output)
#   npm             -> tests/e2e/frontend (bun.lock; firebase + typescript)
version: 2

# One Dependabot pull request per week for the whole repo (owner ruling
# 2026-09-14): every ecosystem below joins the `weekly` group, whose schedule is
# this repo's slot on a weeknight JST (hub `just dependabot-slot <repo>`) — one CI
# run on the runner pool per repo per week instead of one per ecosystem, and no
# org-wide Monday burst. The per-ecosystem cooldown and labels are unchanged;
# commit-message and open-pull-requests-limit live on the group (Dependabot
# refuses them on the entries).
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "13:30"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

updates:
  - package-ecosystem: "github-actions"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/"
    cooldown:
      default-days: 7
    labels: ["dependencies", "github-actions"]
  - package-ecosystem: "cargo"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/"
    cooldown:
      default-days: 7
    labels: ["dependencies", "cargo"]
  - package-ecosystem: "uv"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/"
    # Keep this at seven days to match `[tool.uv] exclude-newer = "7 days"` in
    # pyproject.toml, and change the two together. They gate different things: uv's
    # cutoff decides what may enter uv.lock at all, while this one only decides when
    # Dependabot opens the pull request. Let this window get shorter than uv's and
    # Dependabot proposes releases uv cannot resolve yet, so every such update fails
    # -- which is exactly what happened while uv's cutoff was a fixed date.
    cooldown:
      default-days: 7
    labels: ["dependencies", "python"]
  # bun, not npm: the only lockfile there is bun.lock, which the npm updater
  # cannot read, so it has been proposing manifest edits without touching the
  # lock. Dependabot's bun updater does not yet read bun 1.4's lockfileVersion 2
  # either, so version updates here may fail until it does. While they do,
  # `just frontend-audit` is the only vulnerability gate this package has, and it
  # runs on every pull request as part of the Frontend tsc job.
  - package-ecosystem: "bun"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/tests/e2e/frontend"
    cooldown:
      default-days: 7
    labels: ["dependencies", "e2e-frontend"]
