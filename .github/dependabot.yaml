# Dependabot version updates (first-party; replaces Renovate -- ADR 0013 favours
# minimizing third-party apps with repo write access). Dependabot security
# updates are enabled separately in the repo's security settings.
#
# Supply-chain hardening: a 7-day `cooldown` holds back every routine bump until
# the new version has been public for a week, so a compromised-then-yanked release
# is not pulled in on day zero. Cooldown applies to version updates only --
# Dependabot SECURITY updates (vulnerability fixes) bypass it and still land fast.
#
# Ecosystems in this repo:
#   github-actions  -> .github/workflows/*.yaml (SHA-pinned actions)
#   cargo           -> Cargo.toml (pyo3 packaging chain)
#   uv              -> pyproject.toml + uv.lock (pydantic drives schema output)
#   npm             -> tests/e2e/frontend (bun.lock; firebase + typescript)
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "cargo"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Keep this at seven days to match `[tool.uv] exclude-newer = "7 days"` in
    # pyproject.toml, and change the two together. They gate different things: uv's
    # cutoff decides what may enter uv.lock at all, while this one only decides when
    # Dependabot opens the pull request. Let this window get shorter than uv's and
    # Dependabot proposes releases uv cannot resolve yet, so every such update fails
    # -- which is exactly what happened while uv's cutoff was a fixed date.
    cooldown:
      default-days: 7
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/tests/e2e/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "e2e-frontend"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      e2e-frontend:
        patterns: ["*"]
