# Release: OIDC Trusted Publishing, no long-lived publish tokens (ADR 0013).
#
# Trigger: pushing a `v*` tag. Build + provenance run to completion BEFORE any
# publish. crates.io publishes first, then PyPI (the two registries are not
# transactional -- see ADR 0013 / PUBLISH_HOWTO.md for the split-failure recovery:
# re-run only the failed publish job; the succeeded side is left as-is).
#
# Publish auth is OIDC only:
#   - crates.io: rust-lang/crates-io-auth-action mints a 30-min token (job-scoped,
#     auto-revoked at job end). Trusted Publishing is ENFORCED on the crate.
#   - PyPI: pypa/gh-action-pypi-publish uploads via Trusted Publishing and emits
#     PEP 740 publish attestations automatically (verified on PyPI).
# Additively, actions/attest-build-provenance produces a GitHub SLSA build
# provenance for the wheels (a SEPARATE artifact, verified with `gh attestation
# verify` -- NOT the PyPI PEP 740 attestation).
#
# Security notes:
#   - No untrusted event input is interpolated into any run: step (tag-triggered;
#     the only ${{ }} in a shell context is steps.auth.outputs.token, passed via env).
#   - Every action is pinned to a full commit SHA (repo policy: sha_pinning_required).
#   - The trusted-publisher binding on both registries must match EXACTLY:
#     repo hironow/firepact, workflow filename release.yaml, environment release.
name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; publish jobs elevate to id-token: write at the job level.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release run mid-publish.
  cancel-in-progress: false

jobs:
  # The tag only triggers the run -- crates.io publishes the version in Cargo.toml
  # and PyPI whatever maturin built from pyproject.toml, and nothing else compares
  # either against the tag. Without this gate, tagging a version that is already
  # published skips both publish steps and still reports success. Runs on its own,
  # so it fails within seconds instead of after the wheel matrix.
  version-check:
    name: Tag matches both package versions
    if: github.repository == 'hironow/firepact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ubuntu-latest ships cargo, jq and python3 (>= 3.11, so tomllib is stdlib).
      # The tag is read from the environment, never interpolated into the script.
      - name: Tag must match pyproject.toml and Cargo.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "firepact-core") | .version')"
          py_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=${tag}  Cargo.toml=${cargo_version}  pyproject.toml=${py_version}"
          status=0
          if [ "${cargo_version}" != "${tag}" ]; then
            echo "::error::Cargo.toml is ${cargo_version} but the tag is v${tag}"
            status=1
          fi
          if [ "${py_version}" != "${tag}" ]; then
            echo "::error::pyproject.toml is ${py_version} but the tag is v${tag}"
            status=1
          fi
          exit "${status}"

  linux-wheels:
    name: wheels (linux ${{ matrix.target }})
    if: github.repository == 'hironow/firepact'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          command: build
          # abi3 (Cargo.toml abi3-py311): one stable-ABI wheel covers CPython 3.11+,
          # so a single build interpreter suffices.
          args: --release --out dist --features python -i python3.13
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  native-wheels:
    name: wheels (${{ matrix.platform.os }} ${{ matrix.platform.target }})
    if: github.repository == 'hironow/firepact'
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # macos-latest (Apple Silicon / arm64) for both targets. The Intel
          # macos-13 image was retired 2025-12-04, so x86_64 is cross-compiled
          # on the arm64 runner (maturin builds x86_64 from arm64 fine).
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # abi3: one wheel covers 3.11+; the build interpreter just needs to be >=3.11.
          python-version: "3.13"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          command: build
          args: --release --out dist --features python --interpreter python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: sdist
    if: github.repository == 'hironow/firepact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  provenance:
    name: SLSA build provenance (GitHub artifact attestation)
    needs: [linux-wheels, native-wheels, sdist]
    if: github.repository == 'hironow/firepact'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

  crates-publish:
    name: Publish firepact-core to crates.io (OIDC)
    # Linearized so nothing publishes until the tag is checked and build +
    #   provenance are recorded: version-check + builds -> provenance -> crates.io
    #   -> PyPI (ADR 0013). `provenance` already needs all the build jobs, so
    #   depending on it gates on the full build too.
    needs: [version-check, provenance]
    if: github.repository == 'hironow/firepact'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ubuntu-latest ships a stable Rust toolchain preinstalled; no toolchain
      # action is needed (and it keeps the allowlist surface minimal).
      - name: Mint a short-lived crates.io token via OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: cargo publish (idempotent -- skip if this version is already on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "firepact-core") | .version')"
          # 200 = already published (bootstrap or a prior partial run); 404 = new.
          # No untrusted input here: `version` comes from Cargo.toml via cargo metadata.
          if curl -sfo /dev/null -H 'User-Agent: firepact-release' \
               "https://crates.io/api/v1/crates/firepact-core/${version}"; then
            echo "firepact-core ${version} is already on crates.io -- skipping cargo publish."
          else
            cargo publish -p firepact-core --locked
          fi

  pypi-publish:
    name: Publish firepact to PyPI (OIDC + PEP 740 attestations)
    # crates.io first (which already gated on provenance), then PyPI. The tag
    # check is named again rather than inherited, so removing it from one job
    # cannot silently ungate the other.
    needs: [version-check, crates-publish]
    if: github.repository == 'hironow/firepact'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          # Idempotent re-runs: if a prior attempt uploaded some files before
          # failing, skip the ones already on PyPI instead of colliding. PyPI never
          # allows overwriting an existing file, so this is the safe retry path.
          skip-existing: true
          # PEP 740 attestations are generated automatically (default since v1.11).
