name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, workflow-wide: every job here only reads the repository.
# Nothing comments on a pull request, uploads SARIF, attests an artifact, or
# writes through gh, so no job elevates. setup-takumi-guard-pypi is used with no
# bot-id, which is its anonymous mode: it sets UV_INDEX_URL from its first step
# and never requests an OIDC token, so id-token: write is not needed either.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (repo policy: sha_pinning_required).
jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # The recipes are the definition of what these gates cover; this job runs
      # them so `just check` / `just test` cannot drift from CI. test-rust passes
      # --locked, which catches a Cargo.lock left behind by a version bump.
      - run: just lint-rust
      - run: just test-rust

  python:
    name: Python (ruff / mypy / pytest) - locked
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (uv sync builds the PyO3 ext)
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pin uv so CI resolves uv.lock identically to local -- required for the
          # `uv sync --locked` guard to be reliable (lock revision is uv-version-tied).
          version: "0.11.16"
          python-version: ${{ matrix.python-version }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # Route PyPI installs through Takumi Guard (blocks known-malicious packages
      # before they execute; sets UV_INDEX_URL for this job). Blocking-only mode,
      # no account needed. Must precede any uv/pip install.
      - uses: flatt-security/setup-takumi-guard-pypi@bac24f8a97255d96a277f60de6906154ce0be096 # v1.1.0
      # lock-check is `uv sync --locked`, the uv-side counterpart to cargo's
      # --locked. check-py is ruff, mypy and format drift; test-py builds the
      # binary front-end first, so the py<->rust parity test cannot skip itself.
      - run: just lock-check
      - run: just check-py
      - run: just test-py

  pydantic-matrix:
    name: Pydantic drift canary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pydantic: ["2.9.*", "2.10.*", "2.11.*", "2.12.*", "2.13.*"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pin uv so CI resolves uv.lock identically to local -- required for the
          # `uv sync --locked` guard to be reliable (lock revision is uv-version-tied).
          version: "0.11.16"
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # Route PyPI installs through Takumi Guard (blocks known-malicious packages
      # before they execute; sets UV_INDEX_URL for this job). Blocking-only mode,
      # no account needed. Must precede any uv/pip install.
      - uses: flatt-security/setup-takumi-guard-pypi@bac24f8a97255d96a277f60de6906154ce0be096 # v1.1.0
      - run: uv sync
      # One leg of the canary. The recipe owns the test paths and the env flag that
      # skips the exact schema-layer golden, so this matrix and `just
      # pydantic-matrix` exercise the same thing.
      - name: Run tests against pydantic ${{ matrix.pydantic }}
        run: just pydantic-check "${{ matrix.pydantic }}"

  frontend-typecheck:
    name: Frontend tsc (generated types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Rust rewrite is distributed via the canary channel only; canary is a
          # moving tag, so never reuse a cached executable.
          bun-version: canary
          no-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # Builds the core, emits TypeScript from the contract fixture, installs the
      # consumer with --frozen-lockfile and type-checks it. All of that lives in
      # the recipe so `just ci` runs exactly this.
      - run: just frontend-typecheck

  compat:
    name: Compatibility gate (FULL_TRANSITIVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pin uv so CI resolves uv.lock identically to local -- required for the
          # `uv sync --locked` guard to be reliable (lock revision is uv-version-tied).
          version: "0.11.16"
          python-version: "3.13"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # Route PyPI installs through Takumi Guard (blocks known-malicious packages
      # before they execute; sets UV_INDEX_URL for this job). Blocking-only mode,
      # no account needed. Must precede any uv/pip install.
      - uses: flatt-security/setup-takumi-guard-pypi@bac24f8a97255d96a277f60de6906154ce0be096 # v1.1.0
      - run: uv sync
      - name: Gate the example contract against schemas/ history
        run: just example-compat

  e2e:
    name: E2E (Firestore emulator + onSnapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pin uv so CI resolves uv.lock identically to local -- required for the
          # `uv sync --locked` guard to be reliable (lock revision is uv-version-tied).
          version: "0.11.16"
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Rust rewrite is distributed via the canary channel only; canary is a
          # moving tag, so never reuse a cached executable.
          bun-version: canary
          no-cache: true
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.2.0 (firestore emulator needs a JVM)
        with:
          distribution: temurin
          java-version: "21"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: npm install -g firebase-tools
      # Route PyPI installs through Takumi Guard (blocks known-malicious packages
      # before they execute; sets UV_INDEX_URL for this job). Blocking-only mode,
      # no account needed. Must precede any uv/pip install.
      - uses: flatt-security/setup-takumi-guard-pypi@bac24f8a97255d96a277f60de6906154ce0be096 # v1.1.0
      - run: uv sync
      # --frozen-lockfile: same lockfile guard as the frontend-typecheck job.
      - run: bun install --frozen-lockfile
        working-directory: tests/e2e/frontend
      # The emulators:exec invocation lives in the recipe, so `just ci` runs the
      # same command this job does.
      - name: Run the E2E suite under the Firestore emulator
        run: just test-e2e-emulator

  markdown:
    name: Markdown lint + link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Rust rewrite is distributed via the canary channel only; canary is a
          # moving tag, so never reuse a cached executable.
          bun-version: canary
          no-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just lint-md
      # Relative-link integrity (files + heading anchors); python3 is preinstalled.
      - run: just check-links

  semgrep:
    name: Semgrep (py / rust / ts + project rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          python-version: "3.13"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # Route PyPI installs through Takumi Guard (blocks known-malicious packages
      # before they execute; sets UV_INDEX_URL for this job). Blocking-only mode,
      # no account needed. Must precede any uv/pip install.
      - uses: flatt-security/setup-takumi-guard-pypi@bac24f8a97255d96a277f60de6906154ce0be096 # v1.1.0
      # Pinned, installed with uv rather than pipx (uv is the Python tool this repo
      # uses), and resolved through the screened index like every other install
      # here. An unpinned scanner turns an upstream rule change into a red build on
      # a commit that did not touch anything. Bump it by hand, and only to a
      # version that has cleared the seven-day window and is on the proxy: 1.176.0
      # was published 2026-09-01 and the proxy does not carry it.
      - name: Install semgrep
        run: uv tool install semgrep==1.175.0
      # Registry language packs (p/python, p/rust, p/typescript) + any local rules;
      # findings fail the job. Needs network to fetch the registry rulesets.
      - name: Run semgrep
        run: just semgrep
