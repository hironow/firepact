[project]
name = "firepact"
version = "0.1.0"
description = "Firestore-aware Pydantic -> TypeScript contract generator with a FULL_TRANSITIVE compatibility gate."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "hironow" }]
dependencies = [
    "pydantic>=2.9",
]

[project.scripts]
# Prior-tool-compatible CLI (drop-in for pydantic-to-typescript users).
pydantic2ts = "firepact.cli:main"
# Native entry point for the Firestore-aware generator.
firepact-gen = "firepact.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Phase 0c uses a pure-Python wheel (subprocess to the cargo-built `firepact`
# binary). Phase 0e swaps this build backend for maturin (PyO3-native emit).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/firepact"]

[tool.ruff.lint]
# see: https://docs.astral.sh/ruff/rules/
select = [
    "FAST", # FastAPI
    "C90", # mccabe
    "NPY", # numpy
    "PD", # pandas
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "N", # pep8-naming
    "I",  # isort
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "PLE", # Pylint errors
    "PLR", # Pylint refactor
    "UP", # pyupgrade
    "FURB", # refurb
    # "DOC", # pydoclint
    # "D", # pydocstyle
    "RUF", # Ruff-specific rules
]
extend-ignore = ["E501", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["python", "examples", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "."]
