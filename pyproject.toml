[project]
name = "firepact"
version = "0.1.0"
description = "Firestore-aware Pydantic -> TypeScript contract generator with a FULL_TRANSITIVE compatibility gate."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "hironow" }]
keywords = ["firestore", "typescript", "codegen", "pydantic", "json-schema"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
]

[project.urls]
Repository = "https://github.com/hironow/firepact"
Homepage = "https://github.com/hironow/firepact"

[project.scripts]
# Prior-tool-compatible CLI (drop-in for pydantic-to-typescript users).
pydantic2ts = "firepact.cli:main"
# Native entry point for the Firestore-aware generator.
firepact-gen = "firepact.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]
# E2E only: the backend writer talks to the real Firestore emulator.
e2e = [
    "google-cloud-firestore>=2.16",
]

# maturin builds the PyO3 extension (firepact._core) alongside the pure-Python
# layer under python/. The Python code falls back to the `firepact` subprocess
# when the native module is absent (e.g. a non-maturin dev checkout).
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "firepact._core"
features = ["python"]

[tool.ruff.lint]
# see: https://docs.astral.sh/ruff/rules/
select = [
    "FAST", # FastAPI
    "C90", # mccabe
    "NPY", # numpy
    "PD", # pandas
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "N", # pep8-naming
    "I",  # isort
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "PLE", # Pylint errors
    "PLR", # Pylint refactor
    "UP", # pyupgrade
    "FURB", # refurb
    # "DOC", # pydoclint
    # "D", # pydocstyle
    "RUF", # Ruff-specific rules
]
extend-ignore = ["E501", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["python", "examples", "tests"]

# google-cloud-firestore is an e2e-only dependency (not in the default env).
[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# E2E (tests/e2e) is excluded from the default run -- it needs the emulator and
# the `e2e` dependency group; run it explicitly via `just test-e2e`.
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["python", "."]
